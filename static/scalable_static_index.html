<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>可扩展车辆监控仪表板</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.5.0/socket.io.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/3.9.1/chart.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: 'Microsoft YaHei', Arial, sans-serif; 
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364); 
            color: #fff; 
            min-height: 100vh; 
            padding: 20px;
        }
        .container { max-width: 1400px; margin: 0 auto; }
        
        header { 
            text-align: center; 
            margin-bottom: 30px; 
            padding: 20px; 
            background: rgba(255, 255, 255, 0.1); 
            border-radius: 15px; 
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        h1 { 
            font-size: 2.5rem; 
            background: linear-gradient(45deg, #00b4db, #0083b0);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            margin-bottom: 10px;
        }
        
        .status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding: 15px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            flex-wrap: wrap;
        }
        .status-item {
            display: flex;
            align-items: center;
            margin: 5px 10px;
        }
        .status-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            margin-right: 8px;
        }
        .status-connected { background: #4caf50; animation: pulse 2s infinite; }
        .status-disconnected { background: #f44336; }
        .status-loading { background: #ff9800; }
        
        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.5; }
            100% { opacity: 1; }
        }
        
        .dashboard {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        .card {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            padding: 25px;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        .card h2 {
            color: #4fc3f7;
            margin-bottom: 15px;
            font-size: 1.5rem;
        }
        .value-display {
            font-size: 3rem;
            font-weight: bold;
            text-align: center;
            margin: 20px 0;
        }
        .speed-value { color: #ff5252; }
        .torque-value { color: #69f0ae; }
        .unit {
            text-align: center;
            color: #aaa;
            font-size: 1.2rem;
        }
        
        .mode-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
        }
        .mode-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 8px;
            border-left: 4px solid #4fc3f7;
        }
        .mode-normal { border-left-color: #00e676; }
        .mode-warning { border-left-color: #ff9800; }
        .mode-error { border-left-color: #f44336; }
        .mode-inactive { border-left-color: #9e9e9e; }
        
        .mode-value {
            font-weight: bold;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
        }
        .mode-normal .mode-value { background: rgba(0, 230, 118, 0.2); color: #00e676; }
        .mode-warning .mode-value { background: rgba(255, 152, 0, 0.2); color: #ff9800; }
        .mode-error .mode-value { background: rgba(244, 67, 54, 0.2); color: #f44336; }
        .mode-inactive .mode-value { background: rgba(158, 158, 158, 0.2); color: #9e9e9e; }
        
        .charts {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(500px, 1fr));
            gap: 20px;
            margin-top: 30px;
        }
        .chart-container {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            padding: 20px;
        }
        
        .error-message {
            background: rgba(244, 67, 54, 0.2);
            border-left: 4px solid #f44336;
            padding: 15px;
            margin: 15px 0;
            border-radius: 5px;
            display: none;
        }
        .warning-message {
            background: rgba(255, 193, 7, 0.2);
            border-left: 4px solid #ffc107;
            padding: 15px;
            margin: 15px 0;
            border-radius: 5px;
            display: none;
        }
        .loading {
            text-align: center;
            padding: 40px;
            color: #aaa;
            font-size: 1.2rem;
        }
        .device-selector {
            margin-bottom: 20px;
            text-align: center;
        }
        .device-btn {
            padding: 10px 20px;
            margin: 0 10px;
            background: rgba(79, 195, 247, 0.2);
            border: 1px solid #4fc3f7;
            border-radius: 5px;
            color: white;
            cursor: pointer;
        }
        .device-btn.active {
            background: #4fc3f7;
        }
        
        @media (max-width: 768px) {
            .dashboard { grid-template-columns: 1fr; }
            .charts { grid-template-columns: 1fr; }
            .mode-grid { grid-template-columns: 1fr; }
            .value-display { font-size: 2.5rem; }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🚗 可扩展车辆监控系统</h1>
            <p>支持多种设备标识符的动态仪表板</p>
        </header>
        
        <div class="error-message" id="errorMessage">
            <strong>错误：</strong><span id="errorText"></span>
        </div>
        
        <div class="warning-message" id="warningMessage">
            <strong>警告：</strong><span id="warningText"></span>
        </div>
        
        <div class="status-bar">
            <div class="status-item">
                <div class="status-dot status-loading" id="wsStatusDot"></div>
                <span id="wsStatusText">WebSocket连接中...</span>
            </div>
            <div class="status-item">
                <div class="status-dot status-loading" id="mqttStatusDot"></div>
                <span id="mqttStatusText">MQTT连接中...</span>
            </div>
            <div class="status-item">
                <span>最后更新: </span>
                <span id="lastUpdate">--:--:--</span>
            </div>
            <div class="status-item">
                <span>当前设备: </span>
                <span id="currentDevice">车轮监控</span>
            </div>
        </div>
        
        <div class="device-selector">
            <button class="device-btn active" onclick="switchDevice('wheel_monitor')">车轮监控</button>
            <button class="device-btn" onclick="switchDevice('battery_monitor')">电池监控</button>
        </div>
        
        <div class="loading" id="loadingMessage">
            ⏳ 正在等待数据...
        </div>
        
        <div id="dashboardContent" style="display: none;">
            <!-- 车轮监控设备 -->
            <div id="wheel_monitor" class="device-content">
                <div class="dashboard">
                    <div class="card">
                        <h2>📊 转速值</h2>
                        <div class="value-display speed-value" id="speedValue">--</div>
                        <div class="unit">RPM</div>
                    </div>
                    
                    <div class="card">
                        <h2>⚙️ 转矩值</h2>
                        <div class="value-display torque-value" id="torqueValue">--</div>
                        <div class="unit">N·m</div>
                    </div>
                </div>
                
                <div class="card">
                    <h2>🔧 工作模式状态</h2>
                    <div class="mode-grid" id="modeGrid">
                        <!-- 模式状态将通过JavaScript动态填充 -->
                    </div>
                </div>
            </div>
            
            <!-- 电池监控设备 -->
            <div id="battery_monitor" class="device-content" style="display: none;">
                <div class="dashboard">
                    <div class="card">
                        <h2>🔋 电池电压</h2>
                        <div class="value-display speed-value" id="voltageValue">--</div>
                        <div class="unit">V</div>
                    </div>
                    
                    <div class="card">
                        <h2>⚡ 电池电流</h2>
                        <div class="value-display torque-value" id="currentValue">--</div>
                        <div class="unit">A</div>
                    </div>
                    
                    <div class="card">
                        <h2>🔋 电池电量</h2>
                        <div class="value-display" id="socValue">--</div>
                        <div class="unit">%</div>
                    </div>
                </div>
            </div>
            
            <div class="charts">
                <div class="chart-container">
                    <canvas id="sensorChart"></canvas>
                </div>
            </div>
            
            <div class="card">
                <h2>📋 原始数据</h2>
                <pre id="rawData">等待数据...</pre>
            </div>
        </div>
    </div>

    <script>
        // 全局变量
        let socket = null;
        let chart = null;
        let currentDevice = 'wheel_monitor';
        const dataHistory = {
            speed_value: [],
            torque_value: [],
            voltage: [],
            current: []
        };
        
        // 显示错误消息
        function showError(message) {
            console.error('错误:', message);
            document.getElementById('errorText').textContent = message;
            document.getElementById('errorMessage').style.display = 'block';
            setTimeout(() => {
                document.getElementById('errorMessage').style.display = 'none';
            }, 5000);
        }
        
        // 显示警告消息
        function showWarning(message) {
            console.warn('警告:', message);
            document.getElementById('warningText').textContent = message;
            document.getElementById('warningMessage').style.display = 'block';
            setTimeout(() => {
                document.getElementById('warningMessage').style.display = 'none';
            }, 3000);
        }
        
        // 更新连接状态
        function updateConnectionStatus(service, status, message) {
            const dot = document.getElementById(service + 'StatusDot');
            const text = document.getElementById(service + 'StatusText');
            
            dot.className = 'status-dot status-' + status;
            text.textContent = message;
        }
        
        // 初始化图表
        function initChart() {
            const ctx = document.getElementById('sensorChart').getContext('2d');
            chart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: [],
                    datasets: [
                        {
                            label: '转速 (RPM)',
                            data: [],
                            borderColor: '#ff5252',
                            backgroundColor: 'rgba(255, 82, 82, 0.1)',
                            borderWidth: 2,
                            fill: true
                        },
                        {
                            label: '转矩 (N·m)',
                            data: [],
                            borderColor: '#69f0ae',
                            backgroundColor: 'rgba(105, 240, 174, 0.1)',
                            borderWidth: 2,
                            fill: true
                        }
                    ]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: true
                }
            });
        }
        
        // 切换设备显示
        function switchDevice(deviceId) {
            currentDevice = deviceId;
            
            // 更新按钮状态
            document.querySelectorAll('.device-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            event.target.classList.add('active');
            
            // 显示/隐藏设备内容
            document.querySelectorAll('.device-content').forEach(content => {
                content.style.display = 'none';
            });
            document.getElementById(deviceId).style.display = 'block';
            
            // 更新当前设备显示
            document.getElementById('currentDevice').textContent = 
                deviceId === 'wheel_monitor' ? '车轮监控' : '电池监控';
        }
        
        // 更新模式状态显示
        function updateModeDisplay(data) {
            const modeGrid = document.getElementById('modeGrid');
            modeGrid.innerHTML = '';
            
            for (let i = 1; i <= 18; i++) {
                const modeKey = `mode${i}`;
                if (data[modeKey]) {
                    const modeItem = document.createElement('div');
                    modeItem.className = 'mode-item';
                    
                    // 根据状态内容确定样式
                    if (data[modeKey].includes('正常') || data[modeKey].includes('已就绪')) {
                        modeItem.classList.add('mode-normal');
                    } else if (data[modeKey].includes('报警') || data[modeKey].includes('故障')) {
                        modeItem.classList.add('mode-error');
                    } else if (data[modeKey].includes('非')) {
                        modeItem.classList.add('mode-inactive');
                    } else {
                        modeItem.classList.add('mode-normal');
                    }
                    
                    modeItem.innerHTML = `
                        <span>模式${i}: ${getModeLabel(i)}</span>
                        <span class="mode-value">${data[modeKey]}</span>
                    `;
                    modeGrid.appendChild(modeItem);
                }
            }
        }
        
        // 获取模式标签
        function getModeLabel(modeNumber) {
            const labels = {
                1: '自由模式', 2: '力矩模式', 3: '速度模式', 4: '制动模式',
                5: '零速锁定', 6: '系统状态', 7: '控制器状态', 8: '预充状态',
                9: '旋变状态', 10: '过流状态', 11: '母线过压', 12: '控制电状态',
                13: '母线欠压', 14: '功率限幅', 15: '控制器温度', 16: '电机温度',
                17: '自检状态', 18: '综合报警'
            };
            return labels[modeNumber] || `模式${modeNumber}`;
        }
        
        // 更新数据显示
        function updateDataDisplay(data) {
            console.log('更新数据:', data);
            
            // 根据设备类型自动切换显示
            if (data.device_type && data.device_type !== currentDevice) {
                switchDevice(data.device_type);
            }
            
            // 更新数值显示
            if (data.speed_value !== undefined) {
                document.getElementById('speedValue').textContent = data.speed_value.toFixed(2);
            }
            if (data.torque_value !== undefined) {
                document.getElementById('torqueValue').textContent = data.torque_value.toFixed(4);
            }
            if (data.voltage !== undefined) {
                document.getElementById('voltageValue').textContent = data.voltage.toFixed(1);
            }
            if (data.current !== undefined) {
                document.getElementById('currentValue').textContent = data.current.toFixed(2);
            }
            if (data.soc !== undefined) {
                document.getElementById('socValue').textContent = data.soc;
            }
            
            // 更新模式状态
            if (currentDevice === 'wheel_monitor') {
                updateModeDisplay(data);
            }
            
            // 更新时间戳
            document.getElementById('lastUpdate').textContent = data.timestamp;
            
            // 更新原始数据
            document.getElementById('rawData').textContent = JSON.stringify(data, null, 2);
            
            // 更新图表
            updateChart(data);
            
            // 隐藏加载消息，显示内容
            document.getElementById('loadingMessage').style.display = 'none';
            document.getElementById('dashboardContent').style.display = 'block';
        }
        
        // 更新图表
        function updateChart(data) {
            const now = new Date().toLocaleTimeString();
            
            // 更新数据历史
            if (data.speed_value !== undefined) {
                dataHistory.speed_value.push(data.speed_value);
                if (dataHistory.speed_value.length > 30) dataHistory.speed_value.shift();
            }
            if (data.torque_value !== undefined) {
                dataHistory.torque_value.push(data.torque_value);
                if (dataHistory.torque_value.length > 30) dataHistory.torque_value.shift();
            }
            
            if (chart) {
                // 更新标签
                chart.data.labels.push(now);
                if (chart.data.labels.length > 30) chart.data.labels.shift();
                
                // 更新数据集
                chart.data.datasets[0].data = [...dataHistory.speed_value];
                chart.data.datasets[1].data = [...dataHistory.torque_value];
                
                chart.update();
            }
        }
        
        // 初始化WebSocket连接
        function initWebSocket() {
            try {
                console.log('正在连接WebSocket服务器...');
                socket = io();
                
                socket.on('connect', () => {
                    console.log('WebSocket连接成功');
                    updateConnectionStatus('ws', 'connected', 'WebSocket已连接');
                });
                
                socket.on('update_data', (data) => {
                    console.log('收到数据更新:', data);
                    updateDataDisplay(data);
                });
                
                socket.on('mqtt_status', (data) => {
                    console.log('MQTT状态:', data);
                    updateConnectionStatus('mqtt', 'connected', `MQTT: ${data.topic}`);
                });
                
                socket.on('error', (data) => {
                    showError(data.message);
                });
                
                socket.on('warning', (data) => {
                    showWarning(data.message);
                });
                
                socket.on('disconnect', () => {
                    console.log('WebSocket断开连接');
                    updateConnectionStatus('ws', 'disconnected', 'WebSocket断开');
                });
                
                socket.on('connect_error', (error) => {
                    console.error('WebSocket连接错误:', error);
                    showError('连接服务器失败: ' + error.message);
                    updateConnectionStatus('ws', 'disconnected', '连接失败');
                });
                
            } catch (error) {
                console.error('初始化WebSocket失败:', error);
                showError('初始化WebSocket失败: ' + error.message);
            }
        }
        
        // 页面加载完成后初始化
        window.addEventListener('load', function() {
            console.log('页面加载完成，开始初始化...');
            
            // 检查必要的库
            if (typeof io === 'undefined') {
                showError('Socket.io库加载失败，请检查网络连接');
                return;
            }
            
            if (typeof Chart === 'undefined') {
                showError('Chart.js库加载失败，请检查网络连接');
                return;
            }
            
            // 初始化图表
            initChart();
            
            // 初始化WebSocket连接
            initWebSocket();
            
            // 5秒后如果还没有数据，显示提示
            setTimeout(() => {
                if (document.getElementById('loadingMessage').style.display !== 'none') {
                    showWarning('正在等待MQTT数据...请确保MQTT客户端正在发送消息');
                }
            }, 5000);
        });
    </script>
</body>
</html>
