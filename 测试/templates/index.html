<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>车轮监控数据仪表板</title>
    <script src="https://cdn.bootcdn.net/ajax/libs/socket.io/4.5.0/socket.io.min.js"></script>
    <script src="https://cdn.bootcdn.net/ajax/libs/Chart.js/3.9.1/chart.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Microsoft YaHei', Arial, sans-serif;
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            color: #fff;
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        
        header {
            text-align: center;
            margin-bottom: 30px;
            padding: 20px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 15px;
        }
        
        h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            color: #4fc3f7;
        }
        
        .status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding: 15px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            flex-wrap: wrap;
        }
        
        .status-item {
            display: flex;
            align-items: center;
            margin: 5px 10px;
        }
        
        .status-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            margin-right: 8px;
        }
        
        .status-connected {
            background: #4caf50;
            animation: pulse 2s infinite;
        }
        
        .status-disconnected {
            background: #f44336;
        }
        
        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.5; }
            100% { opacity: 1; }
        }
        
        .dashboard {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .card {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            padding: 25px;
            transition: transform 0.3s ease;
        }
        
        .card:hover {
            transform: translateY(-5px);
        }
        
        .card h2 {
            color: #4fc3f7;
            margin-bottom: 15px;
            font-size: 1.5rem;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .value-display {
            font-size: 3rem;
            font-weight: bold;
            text-align: center;
            margin: 20px 0;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.3);
        }
        
        .speed-value {
            color: #ff5252;
        }
        
        .torque-value {
            color: #69f0ae;
        }
        
        .unit {
            text-align: center;
            color: #aaa;
            font-size: 1.2rem;
            margin-top: -10px;
        }
        
        .mode-list {
            list-style: none;
        }
        
        .mode-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px;
            margin: 8px 0;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 8px;
            border-left: 4px solid #4fc3f7;
        }
        
        .mode-active {
            border-left-color: #00e676;
        }
        
        .mode-inactive {
            border-left-color: #ff5252;
        }
        
        .mode-value {
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.9rem;
            font-weight: bold;
        }
        
        .mode-active .mode-value {
            background: rgba(0, 230, 118, 0.2);
            color: #00e676;
        }
        
        .mode-inactive .mode-value {
            background: rgba(255, 82, 82, 0.2);
            color: #ff5252;
        }
        
        .charts {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(500px, 1fr));
            gap: 20px;
            margin-top: 30px;
        }
        
        .chart-container {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            padding: 20px;
        }
        
        .chart-title {
            text-align: center;
            margin-bottom: 15px;
            color: #4fc3f7;
            font-size: 1.3rem;
        }
        
        .error-message {
            background: rgba(244, 67, 54, 0.2);
            border-left: 4px solid #f44336;
            padding: 15px;
            margin: 15px 0;
            border-radius: 5px;
            display: none;
        }
        
        .warning-message {
            background: rgba(255, 193, 7, 0.2);
            border-left: 4px solid #ffc107;
            padding: 15px;
            margin: 15px 0;
            border-radius: 5px;
            display: none;
        }
        
        .info-message {
            background: rgba(33, 150, 243, 0.2);
            border-left: 4px solid #2196f3;
            padding: 15px;
            margin: 15px 0;
            border-radius: 5px;
            display: none;
        }
        
        .hex-info {
            background: rgba(255, 255, 255, 0.05);
            padding: 15px;
            margin-top: 20px;
            border-radius: 10px;
            font-family: monospace;
            word-break: break-all;
            font-size: 0.9rem;
            display: none;
        }
        
        .loading {
            text-align: center;
            padding: 40px;
            color: #aaa;
            font-size: 1.2rem;
        }
        
        @media (max-width: 768px) {
            .dashboard {
                grid-template-columns: 1fr;
            }
            
            .charts {
                grid-template-columns: 1fr;
            }
            
            .value-display {
                font-size: 2.5rem;
            }
            
            h1 {
                font-size: 2rem;
            }
            
            .status-bar {
                flex-direction: column;
                align-items: flex-start;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🚗 车轮监控数据仪表板</h1>
            <p>实时显示解码后的车轮运行状态</p>
        </header>
        
        <div class="error-message" id="errorMessage">
            <strong>错误：</strong><span id="errorText"></span>
        </div>
        
        <div class="warning-message" id="warningMessage">
            <strong>警告：</strong><span id="warningText"></span>
        </div>
        
        <div class="info-message" id="infoMessage">
            <strong>信息：</strong><span id="infoText"></span>
        </div>
        
        <div class="status-bar">
            <div class="status-item">
                <div class="status-dot status-connected" id="wsStatusDot"></div>
                <span id="wsStatusText">WebSocket连接中...</span>
            </div>
            <div class="status-item">
                <div class="status-dot status-disconnected" id="mqttStatusDot"></div>
                <span id="mqttStatusText">MQTT连接中...</span>
            </div>
            <div class="status-item">
                <span>最后更新: </span>
                <span id="lastUpdate">--:--:--</span>
            </div>
            <div class="status-item">
                <span>数据校验: </span>
                <span id="validStatus">--</span>
            </div>
        </div>
        
        <div class="loading" id="loadingMessage">
            正在等待数据...
        </div>
        
        <div id="dashboardContent" style="display: none;">
            <div class="dashboard">
                <div class="card">
                    <h2>📊 转速值</h2>
                    <div class="value-display speed-value" id="speedValue">--</div>
                    <div class="unit">RPM</div>
                </div>
                
                <div class="card">
                    <h2>⚙️ 转矩值</h2>
                    <div class="value-display torque-value" id="torqueValue">--</div>
                    <div class="unit">N·m</div>
                </div>
                
                <div class="card">
                    <h2>🔧 工作模式</h2>
                    <ul class="mode-list" id="modeList">
                        <li class="mode-item" id="mode1Item">
                            <span>自由模式:</span>
                            <span class="mode-value" id="mode1Value">--</span>
                        </li>
                        <li class="mode-item" id="mode2Item">
                            <span>力矩模式:</span>
                            <span class="mode-value" id="mode2Value">--</span>
                        </li>
                        <li class="mode-item" id="mode3Item">
                            <span>速度模式:</span>
                            <span class="mode-value" id="mode3Value">--</span>
                        </li>
                        <li class="mode-item" id="mode4Item">
                            <span>制动模式:</span>
                            <span class="mode-value" id="mode4Value">--</span>
                        </li>
                    </ul>
                </div>
            </div>
            
            <div class="hex-info" id="hexInfo">
                <div><strong>HEX数据：</strong><span id="hexData"></span></div>
                <div><strong>标识符：</strong><span id="hexIdentifier"></span></div>
            </div>
            
            <div class="charts">
                <div class="chart-container">
                    <div class="chart-title">转速历史趋势</div>
                    <canvas id="speedChart"></canvas>
                </div>
                <div class="chart-container">
                    <div class="chart-title">转矩历史趋势</div>
                    <canvas id="torqueChart"></canvas>
                </div>
            </div>
        </div>
    </div>

    <script>
        console.log('页面开始加载...');
        
        // 全局变量
        let socket = null;
        let speedChart = null;
        let torqueChart = null;
        let speedHistory = [];
        let torqueHistory = [];
        const maxHistory = 30;
        
        // 显示错误消息
        function showError(message) {
            console.error('错误:', message);
            document.getElementById('errorText').textContent = message;
            document.getElementById('errorMessage').style.display = 'block';
            setTimeout(() => {
                document.getElementById('errorMessage').style.display = 'none';
            }, 5000);
        }
        
        // 显示警告消息
        function showWarning(message) {
            console.warn('警告:', message);
            document.getElementById('warningText').textContent = message;
            document.getElementById('warningMessage').style.display = 'block';
            setTimeout(() => {
                document.getElementById('warningMessage').style.display = 'none';
            }, 3000);
        }
        
        // 显示信息消息
        function showInfo(message) {
            console.log('信息:', message);
            document.getElementById('infoText').textContent = message;
            document.getElementById('infoMessage').style.display = 'block';
            setTimeout(() => {
                document.getElementById('infoMessage').style.display = 'none';
            }, 3000);
        }
        
        // 更新连接状态
        function updateConnectionStatus(service, status, message) {
            if (service === 'websocket') {
                const dot = document.getElementById('wsStatusDot');
                const text = document.getElementById('wsStatusText');
                
                if (status === 'connected') {
                    dot.className = 'status-dot status-connected';
                    text.textContent = message || 'WebSocket已连接';
                } else if (status === 'disconnected') {
                    dot.className = 'status-dot status-disconnected';
                    text.textContent = message || 'WebSocket断开';
                }
            } else if (service === 'mqtt') {
                const dot = document.getElementById('mqttStatusDot');
                const text = document.getElementById('mqttStatusText');
                
                if (status === 'connected') {
                    dot.className = 'status-dot status-connected';
                    text.textContent = message || 'MQTT已连接';
                } else if (status === 'disconnected') {
                    dot.className = 'status-dot status-disconnected';
                    text.textContent = message || 'MQTT断开';
                } else if (status === 'message_received') {
                    dot.className = 'status-dot status-connected';
                    text.textContent = message || 'MQTT收到消息';
                }
            }
        }
        
        // 初始化图表
        function initCharts() {
            const speedCtx = document.getElementById('speedChart').getContext('2d');
            const torqueCtx = document.getElementById('torqueChart').getContext('2d');
            
            speedChart = new Chart(speedCtx, {
                type: 'line',
                data: {
                    labels: [],
                    datasets: [{
                        label: '转速 (RPM)',
                        data: [],
                        borderColor: '#ff5252',
                        backgroundColor: 'rgba(255, 82, 82, 0.1)',
                        borderWidth: 2,
                        fill: true,
                        tension: 0.4,
                        pointRadius: 3
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: true,
                    scales: {
                        x: {
                            grid: { color: 'rgba(255, 255, 255, 0.1)' },
                            ticks: { color: '#aaa', maxTicksLimit: 10 }
                        },
                        y: {
                            grid: { color: 'rgba(255, 255, 255, 0.1)' },
                            ticks: { color: '#aaa' }
                        }
                    }
                }
            });
            
            torqueChart = new Chart(torqueCtx, {
                type: 'line',
                data: {
                    labels: [],
                    datasets: [{
                        label: '转矩 (N·m)',
                        data: [],
                        borderColor: '#69f0ae',
                        backgroundColor: 'rgba(105, 240, 174, 0.1)',
                        borderWidth: 2,
                        fill: true,
                        tension: 0.4,
                        pointRadius: 3
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: true,
                    scales: {
                        x: {
                            grid: { color: 'rgba(255, 255, 255, 0.1)' },
                            ticks: { color: '#aaa', maxTicksLimit: 10 }
                        },
                        y: {
                            grid: { color: 'rgba(255, 255, 255, 0.1)' },
                            ticks: { color: '#aaa' }
                        }
                    }
                }
            });
        }
        
        // 更新图表
        function updateCharts(data) {
            const now = new Date().toLocaleTimeString();
            
            // 更新转速图表
            speedHistory.push(data.speed_value);
            if (speedHistory.length > maxHistory) speedHistory.shift();
            
            speedChart.data.labels.push(now);
            if (speedChart.data.labels.length > maxHistory) speedChart.data.labels.shift();
            
            speedChart.data.datasets[0].data = [...speedHistory];
            speedChart.update('none');
            
            // 更新转矩图表
            torqueHistory.push(data.torque_value);
            if (torqueHistory.length > maxHistory) torqueHistory.shift();
            
            torqueChart.data.labels.push(now);
            if (torqueChart.data.labels.length > maxHistory) torqueChart.data.labels.shift();
            
            torqueChart.data.datasets[0].data = [...torqueHistory];
            torqueChart.update('none');
        }
        
        // 更新数据显示
        function updateDataDisplay(data) {
            // 更新数值
            document.getElementById('speedValue').textContent = data.speed_value.toFixed(2);
            document.getElementById('torqueValue').textContent = data.torque_value.toFixed(4);
            
            // 更新工作模式
            document.getElementById('mode1Value').textContent = data.mode1;
            document.getElementById('mode2Value').textContent = data.mode2;
            document.getElementById('mode3Value').textContent = data.mode3;
            document.getElementById('mode4Value').textContent = data.mode4;
            
            // 更新模式样式
            updateModeClass('mode1Item', data.mode1);
            updateModeClass('mode2Item', data.mode2);
            updateModeClass('mode3Item', data.mode3);
            updateModeClass('mode4Item', data.mode4);
            
            // 更新时间戳
            document.getElementById('lastUpdate').textContent = data.timestamp;
            
            // 更新校验状态
            const validStatus = document.getElementById('validStatus');
            validStatus.textContent = data.is_valid ? '通过 ✓' : '失败 ✗';
            validStatus.style.color = data.is_valid ? '#4caf50' : '#f44336';
            
            // 更新HEX信息
            if (data.hex_data) {
                document.getElementById('hexData').textContent = data.hex_data;
                document.getElementById('hexIdentifier').textContent = data.hex_identifier || '未知';
                document.getElementById('hexInfo').style.display = 'block';
            }
            
            // 更新图表
            updateCharts(data);
            
            // 隐藏加载消息，显示内容
            document.getElementById('loadingMessage').style.display = 'none';
            document.getElementById('dashboardContent').style.display = 'block';
        }
        
        // 更新模式样式类
        function updateModeClass(elementId, modeValue) {
            const element = document.getElementById(elementId);
            if (modeValue.includes('自由模式') || modeValue.includes('力矩模式') || 
                modeValue.includes('速度模式') || modeValue.includes('制动模式')) {
                element.className = 'mode-item mode-active';
            } else {
                element.className = 'mode-item mode-inactive';
            }
        }
        
        // 初始化Socket.io连接
        function initSocketConnection() {
            try {
                console.log('正在连接WebSocket服务器...');
                socket = io();
                
                // WebSocket连接成功
                socket.on('connect', function() {
                    console.log('WebSocket连接成功');
                    updateConnectionStatus('websocket', 'connected', 'WebSocket已连接');
                    showInfo('已连接到监控服务器');
                });
                
                // 收到数据更新
                socket.on('update_data', function(data) {
                    console.log('收到数据更新:', data);
                    updateDataDisplay(data);
                });
                
                // 收到MQTT状态
                socket.on('mqtt_status', function(data) {
                    console.log('MQTT状态:', data);
                    updateConnectionStatus('mqtt', data.status, `MQTT: ${data.topic} - ${data.timestamp}`);
                });
                
                // 收到连接状态
                socket.on('connection_status', function(data) {
                    console.log('连接状态:', data);
                    showInfo(data.message);
                });
                
                // 收到错误
                socket.on('error', function(data) {
                    showError(data.message);
                });
                
                // 收到警告
                socket.on('warning', function(data) {
                    showWarning(data.message);
                });
                
                // WebSocket断开
                socket.on('disconnect', function() {
                    console.log('WebSocket断开连接');
                    updateConnectionStatus('websocket', 'disconnected', 'WebSocket断开');
                    showWarning('与服务器断开连接');
                });
                
                // 连接错误
                socket.on('connect_error', function(error) {
                    console.error('WebSocket连接错误:', error);
                    showError('连接服务器失败: ' + error.message);
                    updateConnectionStatus('websocket', 'disconnected', '连接失败');
                });
                
            } catch (error) {
                console.error('初始化WebSocket失败:', error);
                showError('初始化WebSocket失败: ' + error.message);
            }
        }
        
        // 页面加载完成后初始化
        window.addEventListener('load', function() {
            console.log('页面加载完成，开始初始化...');
            
            // 检查必要的库
            if (typeof io === 'undefined') {
                showError('Socket.io库加载失败，请检查网络连接');
                return;
            }
            
            if (typeof Chart === 'undefined') {
                showError('Chart.js库加载失败，请检查网络连接');
                return;
            }
            
            // 初始化图表
            initCharts();
            
            // 初始化WebSocket连接
            initSocketConnection();
            
            // 5秒后如果还没有数据，显示提示
            setTimeout(() => {
                if (document.getElementById('loadingMessage').style.display !== 'none') {
                    showInfo('正在等待MQTT数据...请确保MQTT客户端正在发送消息');
                }
            }, 5000);
        });
    </script>
</body>
</html>
